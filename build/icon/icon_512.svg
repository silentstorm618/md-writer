<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="55%" stop-color="#4A6FE3"/>
      <stop offset="100%" stop-color="#3B57C9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9EEFB"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A62A"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6.144" stdDeviation="9.216" flood-color="#1B2A5E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="512" height="512" rx="114.5344" ry="114.5344" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="256" rx="114.5344" ry="114.5344" fill="#FFFFFF" opacity="0.10"/>

  <!-- 文档 -->
  <g filter="url(#sh)">
    <path d="M 133.12 92.16
             L 312.32 92.16
             L 378.88 158.72
             L 378.88 430.08000000000004
             L 133.12 430.08000000000004 Z"
          fill="url(#paper)"/>
    <!-- 折角 -->
    <path d="M 312.32 92.16
             L 312.32 158.72
             L 378.88 158.72 Z"
          fill="#C6D2F5"/>
  </g>

  <!-- 文本行（模拟 Markdown） -->
  <g stroke="#9AA8C7" stroke-width="11.264" stroke-linecap="round">
    <line x1="161.28" y1="158.72" x2="332.8" y2="158.72"/>
    <line x1="161.28" y1="186.88" x2="350.71999999999997" y2="186.88"/>
    <line x1="161.28" y1="215.04000000000002" x2="307.2" y2="215.04000000000002"/>
  </g>
  <!-- 标题行更粗 -->
  <rect x="161.28" y="121.856" width="102.4" height="14.336" rx="7.168" fill="#5B8DEF"/>

  <!-- M 标记（Markdown） -->
  <g stroke="#5B8DEF" stroke-width="15.36" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M 163.84 391.68000000000006 L 163.84 350.72 L 186.88 371.20000000000005 L 209.92000000000002 350.72 L 209.92000000000002 391.68000000000006"/>
  </g>

  <!-- 笔 -->
  <g transform="rotate(-42 358.4 337.92)">
    <rect x="340.48" y="215.04" width="38.4" height="153.6" rx="9.216" fill="url(#pen)"/>
    <path d="M 340.48 368.64 L 359.68 409.6 L 378.88 368.64 Z" fill="#3B3218"/>
    <rect x="340.48" y="232.96" width="38.4" height="14.336" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>