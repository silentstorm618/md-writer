<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="55%" stop-color="#4A6FE3"/>
      <stop offset="100%" stop-color="#3B57C9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9EEFB"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A62A"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.072" stdDeviation="4.608" flood-color="#1B2A5E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="256" height="256" rx="57.2672" ry="57.2672" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="128" rx="57.2672" ry="57.2672" fill="#FFFFFF" opacity="0.10"/>

  <!-- 文档 -->
  <g filter="url(#sh)">
    <path d="M 66.56 46.08
             L 156.16 46.08
             L 189.44 79.36
             L 189.44 215.04000000000002
             L 66.56 215.04000000000002 Z"
          fill="url(#paper)"/>
    <!-- 折角 -->
    <path d="M 156.16 46.08
             L 156.16 79.36
             L 189.44 79.36 Z"
          fill="#C6D2F5"/>
  </g>

  <!-- 文本行（模拟 Markdown） -->
  <g stroke="#9AA8C7" stroke-width="5.632" stroke-linecap="round">
    <line x1="80.64" y1="79.36" x2="166.4" y2="79.36"/>
    <line x1="80.64" y1="93.44" x2="175.35999999999999" y2="93.44"/>
    <line x1="80.64" y1="107.52000000000001" x2="153.6" y2="107.52000000000001"/>
  </g>
  <!-- 标题行更粗 -->
  <rect x="80.64" y="60.928" width="51.2" height="7.168" rx="3.584" fill="#5B8DEF"/>

  <!-- M 标记（Markdown） -->
  <g stroke="#5B8DEF" stroke-width="7.68" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M 81.92 195.84000000000003 L 81.92 175.36 L 93.44 185.60000000000002 L 104.96000000000001 175.36 L 104.96000000000001 195.84000000000003"/>
  </g>

  <!-- 笔 -->
  <g transform="rotate(-42 179.2 168.96)">
    <rect x="170.24" y="107.52" width="19.2" height="76.8" rx="4.608" fill="url(#pen)"/>
    <path d="M 170.24 184.32 L 179.84 204.8 L 189.44 184.32 Z" fill="#3B3218"/>
    <rect x="170.24" y="116.48" width="19.2" height="7.168" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>