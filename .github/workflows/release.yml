name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      # secrets 上下文不允许出现在 step 的 if 里（GitHub 会判定整个 workflow 无效，
      # 连 job 都不会生成）。必须先落到 job 级 env，再用 env.* 判断。
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          # jsdom@30 / undici@8 要求 Node 22.19+，Node 20 会直接崩在 require 阶段
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 跑自检
        run: npm test

      - name: 同步版本号到 Info.plist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" native/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" native/Info.plist
          echo "版本设为 $VER (build $GITHUB_RUN_NUMBER)"

      - name: 构建 .app
        run: make app

      # ===================================================================
      # 以下两步只在配置了签名证书时才执行。
      # 当前未配置 → 自动跳过，产物未签名，靠 Homebrew Cask 分发。
      # ===================================================================

      - name: 导入签名证书
        if: ${{ env.HAS_CERT != '' }}
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" /tmp/build.keychain
          security set-keychain-settings -lut 3600 /tmp/build.keychain
          security import /tmp/cert.p12 -k /tmp/build.keychain \
            -P "$CERT_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PWD" /tmp/build.keychain
          security list-keychain -d user -s /tmp/build.keychain
          rm -f /tmp/cert.p12

      - name: 签名 + 公证 + 生成 dmg/pkg
        if: ${{ env.HAS_CERT != '' }}
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_PATH: /tmp/AuthKey.p8
        run: |
          if [ -n "$NOTARY_KEY_ID" ]; then
            printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
            chmod 600 "$NOTARY_KEY_PATH"
          fi
          python3 build/notarize.py --dmg --pkg

      # ===================================================================
      # 无证书时的产物生成（当前走这条路）
      # ===================================================================

      - name: 生成 dmg + pkg（未签名）
        if: ${{ env.HAS_CERT == '' }}
        run: |
          python3 build/make-dmg.py
          python3 build/make-pkg.py

      # ===================================================================

      - name: 计算 sha256
        id: sha
        run: |
          cd dist
          echo "dmg=$(shasum -a 256 ./*.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "pkg=$(shasum -a 256 ./*.pkg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # 说明文本在 shell 里生成：GH Actions 表达式不支持字符串里的反引号，
      # 直接写在 body 里会导致整个 workflow 解析失败。
      - name: 生成 Release 说明
        run: |
          # shellcheck disable=SC2016   # 反引号是写给 Markdown 看的，不要在这展开
          {
            echo "## 安装"
            echo ""
            echo '```bash'
            echo "brew tap silentstorm618/md-writer https://github.com/silentstorm618/md-writer"
            echo "brew trust silentstorm618/md-writer"
            echo "brew install --cask md-writer"
            echo '```'
            echo ""
            echo '或从下方 Assets 下载 `MDWriter-<version>.pkg`（双击进安装器）或 `.dmg`（拖入 Applications）。'
            echo ""
            if [ -n "$HAS_CERT" ]; then
              echo "✅ 本版本已使用 Developer ID 签名并通过 Apple 公证，可直接打开。"
            else
              echo "⚠️ 本版本尚未签名公证（项目未加入 Apple Developer Program）。"
              echo ""
              echo "若 macOS 提示「已损坏，无法打开」，请执行："
              echo ""
              echo '```bash'
              echo "xattr -dr com.apple.quarantine /Applications/MDWriter.app"
              echo '```'
              echo ""
              echo "或使用上面的 Homebrew 方式安装（自动处理）。"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true

      # cask 就在本仓库根目录的 Casks/，直接改完推回 main 即可。
      # 用内置 GITHUB_TOKEN，不需要额外配 TAP_GITHUB_TOKEN。
      # 注意：这次 push 不会再次触发本 workflow（它只监听 v* tag）。
      - name: 更新 cask 的 version / sha256
        env:
          VERSION: ${{ github.ref_name }}
          SHA_PKG: ${{ steps.sha.outputs.pkg }}
        run: |
          VER="${VERSION#v}"
          sed -i '' "s/version \".*\"/version \"$VER\"/" Casks/md-writer.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA_PKG\"/" Casks/md-writer.rb
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/md-writer.rb
          if git diff --staged --quiet; then
            echo "cask 无变化，跳过提交"
          else
            git commit -m "chore: bump cask to $VER"
            # 固定推 main：tag 触发时 GITHUB_REF_NAME 是 "v1.0.2"，不能拿它当分支名
            git push origin HEAD:refs/heads/main
          fi
