<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Writer</title>
<style>
/* ---------- 基础变量 ---------- */
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --bg-panel: #fbfbfc;
  --fg: #1f2328;
  --fg-soft: #59636e;
  --fg-faint: #8b949e;
  --border: #e3e6ea;
  --border-soft: #eef0f3;
  --accent: #4a6fe3;
  --accent-soft: #eaf0ff;
  --danger: #e5534b;
  --ok: #1a7f37;

  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --radius: 8px;
  --shadow: 0 8px 28px rgba(15, 23, 42, .12);
  --zoom: 1;
  --editor-font-size: 16px;

  /* 内容主题变量（由 theme.js 覆盖）。默认跟随应用深浅色，
     保证「应用外壳」和「文档内容」是一套配色，不会出现深底黑字。 */
  --t-bg: #ffffff;
  --t-fg: #1f2328;
  --t-muted: #6b7280;
  --t-border: #d8dee4;
  --t-accent: #0969da;
  --t-code-bg: #f6f8fa;
  --t-quote-bg: #f6f8fa;
  --t-quote-border: #d0d7de;
  --t-table-head: #f6f8fa;
  --t-mark-bg: #fff8c5;
  --t-radius: 8px;
  --t-line-height: 1.75;
  --t-heading-weight: 650;
  --t-max-width: 820px;
  --t-font-size: 16px;
  --t-font-family: -apple-system, "PingFang SC", sans-serif;
}

/* 深色：取自实际截图的主色（#101010 系）与强调蓝 #7ba6f8 */
[data-theme="dark"] {
  --bg: #101010;
  --bg-soft: #16181d;
  --bg-panel: #14161b;
  --fg: #e6e6e6;
  --fg-soft: #a8b0bb;
  --fg-faint: #7d838d;
  --border: #262a31;
  --border-soft: #1e2127;
  --accent: #7ba6f8;
  --accent-soft: #212b43;
  --danger: #ff6b63;
  --ok: #4ac26b;
  --shadow: 0 8px 28px rgba(0, 0, 0, .6);

  /* 内容区在深色下必须同步切深，否则出现「深底黑字」 */
  --t-bg: #101010;
  --t-fg: #e6e6e6;
  --t-muted: #979ea7;
  --t-border: #2a2e35;
  --t-accent: #7ba6f8;
  --t-code-bg: #191c22;
  --t-quote-bg: #191c22;
  --t-quote-border: #2f343c;
  --t-table-head: #191c22;
  --t-mark-bg: #4a4220;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

/* ---------- 布局 ---------- */
#app {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto 1fr auto;
  height: 100vh;
}
body.no-sidebar #sidebar { display: none; }

/* ---------- Tab 栏 ---------- */
#tab-bar {
  grid-column: 1 / -1;
  display: flex; align-items: stretch; gap: 1px;
  height: 34px; padding: 0 8px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  user-select: none;
}
#tab-bar::-webkit-scrollbar { display: none; }

.tab {
  display: flex; align-items: center; gap: 6px;
  min-width: 96px; max-width: 220px;
  padding: 0 8px 0 11px;
  border-right: 1px solid var(--border);
  background: transparent;
  color: var(--fg-soft);
  font-size: 12px;
  cursor: default;
  white-space: nowrap;
  position: relative;
  transition: background .12s, color .12s;
}
.tab:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
.tab.active {
  background: var(--bg);
  color: var(--fg);
  font-weight: 500;
}
/* 激活 Tab 用顶部高亮条标示 */
.tab.active::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
}

.tab-icon { font-size: 8px; color: var(--fg-faint); flex: none; }
.tab.active .tab-icon { color: var(--accent); }

.tab-name {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* 未保存：标题前圆点 */
.tab.dirty .tab-name { font-style: italic; }
.tab.dirty .tab-icon { color: var(--accent); }

.tab-idx {
  font-size: 9.5px; color: var(--fg-faint);
  font-family: var(--mono);
  padding: 0 3px; border-radius: 3px;
  background: color-mix(in srgb, var(--fg) 7%, transparent);
  flex: none;
}

.tab-close {
  width: 16px; height: 16px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 4px;
  background: transparent; color: var(--fg-faint);
  font-size: 13px; line-height: 1; cursor: pointer;
  opacity: 0; transition: opacity .12s, background .12s;
}
.tab:hover .tab-close,
.tab.active .tab-close { opacity: 1; }
.tab-close:hover { background: var(--danger); color: #fff; }

/* 拖拽排序 */
.tab[draggable="true"] { -webkit-user-drag: element; }
.tab.dragging {
  opacity: .4;
  background: var(--accent-soft);
}
.tab.drop-before::before,
.tab.drop-after::after {
  content: '';
  position: absolute; top: 3px; bottom: 3px;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
}
.tab.drop-before::before { left: -1px; }
.tab.drop-after::after { right: -1px; }

/* ---------- 工具栏 ---------- */
#toolbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 4px;
  height: 46px; padding: 0 12px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
  user-select: none;
  overflow-x: auto;
  scrollbar-width: none;
}
#toolbar::-webkit-scrollbar { display: none; }

.tb-group { display: flex; align-items: center; gap: 2px; }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 7px; flex: none; }

.tb-btn {
  height: 28px; min-width: 28px; padding: 0 7px;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--fg-soft);
  font-size: 12.5px; cursor: pointer;
  white-space: nowrap;
  transition: background .12s, color .12s;
}
.tb-btn:hover { background: var(--bg); color: var(--fg); }
.tb-btn:active { transform: translateY(.5px); }
.tb-btn.active {
  background: var(--accent-soft); color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 25%, transparent);
}
.tb-btn.icon { font-size: 14px; }
.tb-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.seg {
  display: inline-flex; background: var(--bg); border: 1px solid var(--border);
  border-radius: 7px; padding: 2px; gap: 2px;
}
.seg button {
  height: 22px; padding: 0 10px; border: none; border-radius: 5px;
  background: transparent; color: var(--fg-soft);
  font-size: 12px; cursor: pointer; white-space: nowrap;
}
.seg button.active { background: var(--accent); color: #fff; }

.zoom-label { font-size: 11.5px; color: var(--fg-faint); min-width: 40px; text-align: center; }

.spacer { flex: 1; }

.save-state {
  font-size: 11.5px; color: var(--fg-faint);
  padding: 0 8px; white-space: nowrap;
}
.save-state.dirty { color: var(--accent); }

/* ---------- 侧边栏 ---------- */
#sidebar {
  width: 232px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#side-tabs {
  display: flex; gap: 2px; padding: 8px 10px;
  border-bottom: 1px solid var(--border-soft);
}
#side-tabs button {
  flex: 1; height: 24px; border: none; border-radius: 6px;
  background: transparent; color: var(--fg-soft);
  font-size: 12px; cursor: pointer;
}
#side-tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

#sidebar-body { flex: 1; overflow-y: auto; padding: 10px; }

.side-empty {
  text-align: center; color: var(--fg-faint);
  font-size: 12px; padding: 40px 10px; line-height: 1.8;
}
.side-empty span { font-size: 11px; opacity: .75; }

.md-toc { background: none !important; border: none !important; padding: 0 !important; }
.md-toc .md-toc-title { display: none; }
.md-toc ul { list-style: none; padding-left: 12px; margin: 0; }
.md-toc > ul { padding-left: 0; }
.md-toc li { margin: 1px 0; }
.md-toc a {
  display: block; padding: 4px 8px; border-radius: 5px;
  color: var(--fg-soft); text-decoration: none;
  font-size: 12px; line-height: 1.5;
  border-left: 2px solid transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.md-toc a:hover { background: var(--bg-soft); color: var(--accent); }
.md-toc a.lv2 { padding-left: 18px; font-size: 11.5px; }
.md-toc a.lv3 { padding-left: 28px; font-size: 11.5px; opacity: .85; }

.asset-item {
  border: 1px solid var(--border-soft); border-radius: 6px;
  overflow: hidden; margin-bottom: 8px; cursor: pointer;
  background: var(--bg);
}
.asset-item:hover { border-color: var(--accent); }
.asset-item img { width: 100%; height: 72px; object-fit: cover; display: block; background: var(--bg-soft); }
.asset-name {
  padding: 4px 7px; font-size: 10.5px; color: var(--fg-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---------- 主区域 ---------- */
#main {
  display: grid;
  overflow: hidden;
  background: var(--bg);
  min-height: 0;
}
body[data-mode="split"] #main { grid-template-columns: 1fr 1px 1fr; }
body[data-mode="wysiwyg"] #main { grid-template-columns: 1fr; }
body[data-mode="source"] #main { grid-template-columns: 1fr; }

/* hidden 属性由 JS 的 MODE_PANES 统一控制，这里只兜底 */
.mode-pane[hidden] { display: none !important; }

#source-host { height: 100%; overflow: hidden; }
#source-host .cm-editor { height: 100%; }
#source-host .cm-scroller { font-family: var(--mono); }

#preview-scroll { height: 100%; overflow-y: auto; }

/* 每个 Tab 一个编辑区实例，堆在同一个 host 里，通过 hidden 切换 */
/*
 * 每个 Tab 一个编辑区实例，堆在同一个 host 里，通过 hidden 切换。
 *
 * 注意结构：createWYSIWYG 会把 .wysiwyg 直接加在 .tab-editor 上，
 * 也就是说对所见即所得而言「Tab 容器」和「滚动容器」是同一个元素，
 * 不能用 .tab-editor > .wysiwyg 这种子代选择器（匹配不到）。
 *
 * 高度必须由视口决定而不是被内容撑开，所以从 .mode-pane 往下每层
 * 都要 min-height:0 + height:100%，滚动交给最内层自己。
 */
.mode-pane {
  overflow: hidden;
  position: relative;
  min-width: 0;
  min-height: 0;
  height: 100%;
}

/*
 * host 容器：只负责高度传递与显隐，绝不吞掉内层的滚动。
 * 三个 host 都是 flex 列容器，让 .tab-editor 撑满。
 */
#wysiwyg-host, #source-host {
  height: 100%;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* 预览容器本身就是滚动容器 */
#preview-scroll {
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.tab-editor {
  flex: 1 1 auto;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}
.tab-editor[hidden] { display: none !important; }

/* 所见即所得：.wysiwyg 与 .tab-editor 同元素，由它负责滚动 */
.wysiwyg {
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* 源码：滚动必须由 CodeMirror 自己的 .cm-scroller 承担。
   不能给 .cm-editor 设 overflow:hidden —— 那会把滚动条掐断，
   导致整个源码区滚不动。外层只负责传递高度。 */
.source-pane,
.source-pane .cm-editor {
  height: 100%;
  min-height: 0;
  overflow: hidden;
}
.source-pane .cm-scroller {
  height: 100%;
  min-height: 0;
  overflow-x: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.pane-divider { background: var(--border); width: 1px; }
.pane-divider[hidden] { display: none; }

/* ---------- 所见即所得编辑区 ---------- */
.wysiwyg {
  height: 100%;
  overflow-y: auto;
  padding: 40px 28px 45vh;
  outline: none;
  font-family: var(--t-font-family);
  font-size: var(--editor-font-size);
  line-height: var(--t-line-height);
  color: var(--t-fg);
}
/* 缩放用 font-size 实现，避免 transform: scale 破坏表格/布局的宽度计算 */
.wysiwyg > * { max-width: var(--t-max-width); margin-left: auto; margin-right: auto; }

.wysiwyg p { margin: 0 0 1em; }
.wysiwyg h1, .wysiwyg h2, .wysiwyg h3,
.wysiwyg h4, .wysiwyg h5, .wysiwyg h6 {
  font-weight: var(--t-heading-weight); line-height: 1.35; margin: 1.6em 0 .6em;
}
.wysiwyg h1 { font-size: 1.85em; padding-bottom: .3em; border-bottom: 1px solid var(--t-border); }
.wysiwyg h2 { font-size: 1.48em; padding-bottom: .28em; border-bottom: 1px solid var(--t-border); }
.wysiwyg h3 { font-size: 1.2em; }
.wysiwyg h4 { font-size: 1.06em; }
.wysiwyg h5, .wysiwyg h6 { font-size: .98em; color: var(--fg-soft); }

.wysiwyg ul, .wysiwyg ol { margin: 0 0 1.1em; padding-left: 1.7em; }
.wysiwyg li { margin: .25em 0; }
.wysiwyg ul.contains-task-list, .wysiwyg li.md-task { list-style: none; }
.wysiwyg li.md-task { padding-left: .2em; }
.wysiwyg li.md-task input { margin-right: .5em; }

.wysiwyg blockquote {
  margin: 0 0 1.2em; padding: .65em 1.05em;
  background: var(--t-quote-bg);
  border-left: 4px solid var(--t-quote-border);
  color: var(--t-fg-soft);
  border-radius: 0 var(--t-radius) var(--t-radius) 0;
}
.wysiwyg blockquote > *:last-child { margin-bottom: 0; }

.wysiwyg code {
  font-family: var(--mono); font-size: .88em;
  background: var(--t-code-bg); padding: .16em .36em;
  border-radius: calc(var(--t-radius) - 2px);
  border: 1px solid var(--t-border);
}
.wysiwyg pre.md-code {
  position: relative;
  background: var(--t-code-bg);
  border: 1px solid var(--t-border);
  border-radius: var(--t-radius);
  padding: 15px 17px; margin: 0 0 1.25em;
  overflow-x: auto; line-height: 1.6;
}
.wysiwyg pre.md-code code {
  background: none; border: none; padding: 0;
  font-size: .85em; white-space: pre;
}
.wysiwyg .md-code-lang {
  position: absolute; top: 5px; right: 9px;
  font-size: 10.5px; color: var(--fg-faint); font-family: var(--mono);
}

.wysiwyg table {
  border-collapse: collapse;
  width: 100%;
  table-layout: auto;
  margin: 0 0 1.3em;
  font-size: .94em;
  display: table;
  overflow: visible;
}
.wysiwyg th, .wysiwyg td {
  border: 1px solid var(--t-border);
  padding: .55em .8em;
  text-align: left;
  vertical-align: top;
  /* 防止长内容（如代码、URL）把表格撑破 */
  word-break: break-word;
  overflow-wrap: anywhere;
  min-width: 3em;
}
.wysiwyg th {
  background: var(--t-table-head);
  font-weight: 650;
  white-space: nowrap;
}
/* 表格内不留段落间距，避免行高异常 */
.wysiwyg td > p, .wysiwyg th > p { margin: 0; }
/* 单元格内的代码块不撑宽 */
.wysiwyg td pre, .wysiwyg th pre { margin: 0; white-space: pre-wrap; }

.wysiwyg img { max-width: 100%; height: auto; border-radius: var(--t-radius); display: block; margin: .4em auto; }
.wysiwyg hr { border: none; border-top: 1px solid var(--t-border); margin: 1.9em 0; }

.wysiwyg .md-mermaid {
  margin: 0 0 1.3em; padding: 16px 10px; text-align: center;
  background: var(--t-quote-bg); border: 1px solid var(--t-border);
  border-radius: var(--t-radius); overflow-x: auto;
}
.wysiwyg .md-mermaid svg { max-width: 100%; height: auto; }
.wysiwyg .md-math, .wysiwyg .md-math-block {
  font-family: var(--mono); background: var(--t-code-bg);
  padding: .1em .3em; border-radius: 4px; font-size: .9em;
}
.wysiwyg .md-math-block {
  display: block; text-align: center; padding: .8em; margin-bottom: 1.2em;
}
.wysiwyg a { color: var(--accent); }

/* ---------- 预览区 ---------- */
#preview {
  font-family: var(--t-font-family);
  /* 缩放走 font-size，与编辑器保持一致 */
  font-size: calc(var(--t-font-size) * var(--zoom));
  line-height: var(--t-line-height);
  color: var(--t-fg);
  padding: 40px 28px 80px;
}
#preview > .md-body, #preview.md-body { max-width: var(--t-max-width); margin: 0 auto; }
/* 预览区表格与所见即所得保持同样的排版规则 */
#preview table {
  border-collapse: collapse; table-layout: auto;
  width: 100%; margin: 0 0 1.4em; font-size: .94em;
}
#preview th, #preview td {
  border: 1px solid var(--t-border);
  padding: .6em .85em; text-align: left; vertical-align: top;
  word-break: break-word; overflow-wrap: anywhere;
}
#preview th { background: var(--t-table-head); font-weight: 650; }

/* ---------- 状态栏 ---------- */
#statusbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 14px;
  height: 24px; padding: 0 14px;
  background: var(--bg-soft);
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--fg-faint);
  user-select: none;
}
#statusbar .spacer { flex: 1; }
.status-dirty {
  color: var(--accent); font-size: 11px;
}
.status-dirty:empty { display: none; }
.cursor-pos { font-size: 11px; opacity: .9; }
.status-hint { opacity: .85; }
.status-hint kbd {
  font-family: var(--mono); font-size: 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 0 3px; margin: 0 1px;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 40px; left: 50%;
  transform: translate(-50%, 14px);
  background: var(--fg); color: var(--bg);
  padding: 8px 16px; border-radius: 20px;
  font-size: 12.5px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.ok { background: var(--ok); color: #fff; }
.toast.warn { background: #d29922; color: #fff; }
.toast.error { background: var(--danger); color: #fff; }

/* ---------- 右侧检视器 ---------- */
.inspector {
  position: fixed; top: 46px; right: 0; bottom: 24px;
  width: 236px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  padding: 14px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform .22s ease;
  z-index: 50;
}
body.show-inspector .inspector { transform: translateX(0); }

.insp-section { margin-bottom: 20px; }
.insp-title {
  font-size: 11px; font-weight: 600; color: var(--fg-faint);
  text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 8px;
}
#theme-cards { display: flex; flex-direction: column; gap: 4px; }
.theme-card {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 9px; border: 1px solid var(--border-soft);
  border-radius: 7px; background: var(--bg);
  cursor: pointer; font-size: 12px; color: var(--fg-soft);
  text-align: left;
}
.theme-card:hover { border-color: var(--accent); }
.theme-card.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.theme-dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid; flex: none; }
.theme-name { font-weight: 500; }

.insp-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.insp-row label { font-size: 11.5px; color: var(--fg-soft); width: 46px; flex: none; }
.insp-row select {
  flex: 1; height: 26px; padding: 0 6px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg); font-size: 12px;
  /* 下拉控件不窄一截，与上方等宽对齐 */
  width: 100%; min-width: 0;
}

.insp-toggle {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--fg-soft); cursor: pointer;
  padding: 4px 0;
}
.insp-toggle input { margin: 0; }

/* ---------- 查找 / 替换 ---------- */
.find-bar {
  position: fixed; top: 56px; right: 16px;
  display: none; flex-direction: column; gap: 6px;
  padding: 8px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  z-index: 80; font-size: 12.5px;
  min-width: 320px;
}
.find-bar.show { display: flex; }
.find-bar input[type=text] {
  flex: 1; height: 26px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg); font-size: 12.5px;
  outline: none;
}
.find-bar input[type=text]:focus { border-color: var(--accent); }
.find-bar > #find-replace-row {
  display: flex; gap: 6px; align-items: center;
}
.find-bar .find-count {
  font-size: 11px; color: var(--fg-faint);
  padding: 0 4px; font-variant-numeric: tabular-nums;
  flex: none; min-width: 32px; text-align: center;
}
.find-bar button {
  height: 26px; min-width: 26px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg-soft);
  cursor: pointer; font-size: 13px;
}
.find-bar button:hover { background: var(--bg-soft); color: var(--fg); }
.find-bar button#find-close { min-width: 26px; }

/* 查找高亮：所见即所得里直接用 <mark> 包住 */
.find-mark {
  background: rgba(255, 220, 80, .55);
  color: inherit;
  padding: 0;
  border-radius: 2px;
}
.find-mark.active {
  background: #ffb84d;
  color: #000;
  box-shadow: 0 0 0 1px #f59e0b;
}
[data-theme="dark"] .find-mark { background: rgba(255, 220, 80, .25); }
[data-theme="dark"] .find-mark.active { background: #ffb84d; color: #000; }

/* ---------- 模态对话框（保存确认等） ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, .35);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  animation: modal-fade .15s ease-out;
}
@keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 18px 20px 14px;
  min-width: 320px; max-width: 480px;
}
.modal-title {
  font-size: 14px; font-weight: 600;
  color: var(--fg); margin-bottom: 6px;
}
.modal-body {
  font-size: 12.5px; color: var(--fg-soft);
  line-height: 1.6; margin-bottom: 14px;
}
.modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
}
.modal-actions button {
  height: 30px; min-width: 70px; padding: 0 14px;
  border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg-soft); color: var(--fg);
  font-size: 12.5px; cursor: pointer;
}
.modal-actions button:hover { background: var(--border-soft); }
.modal-actions button.primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.modal-actions button.primary:hover { background: color-mix(in srgb, var(--accent) 85%, black); }
.modal-actions button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}

/* ---------- 启动恢复"撤销"按钮 ---------- */
.restore-undo-btn {
  position: fixed; bottom: 56px; left: 50%;
  transform: translateX(-50%);
  height: 32px; padding: 0 16px;
  border: 1px solid var(--accent);
  border-radius: 16px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow);
  z-index: 90;
  animation: restore-fade .2s ease-out;
}
@keyframes restore-fade { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translateX(-50%); } }
.restore-undo-btn:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body data-mode="wysiwyg">

<div id="app">
  <!-- 工具栏 -->
  <div id="toolbar">
    <div class="seg" role="tablist">
      <button data-mode-btn="wysiwyg" data-cmd="mode" data-value="wysiwyg" class="active"
              title="所见即所得 ⌥⌘1">所见即所得</button>
      <button data-mode-btn="source" data-cmd="mode" data-value="source"
              title="Markdown 源码 ⌥⌘2">源码</button>
      <button data-mode-btn="split" data-cmd="mode" data-value="split"
              title="分栏 ⌥⌘3">分栏</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="newDoc" title="新建标签页 ⌘N">＋ 新建</button>
    </div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="h1" title="一级标题">H1</button>
      <button class="tb-btn" data-cmd="h2" title="二级标题">H2</button>
      <button class="tb-btn" data-cmd="h3" title="三级标题">H3</button>
      <button class="tb-btn" data-cmd="p" title="正文">正文</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="bold" title="粗体 ⌘B"><b>B</b></button>
      <button class="tb-btn" data-cmd="italic" title="斜体 ⌘I"><i>I</i></button>
      <button class="tb-btn" data-cmd="underline" title="下划线 ⌘U"><u>U</u></button>
      <button class="tb-btn" data-cmd="code" title="行内代码 ⌘⇧`">‹›</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="ul" title="项目符号">•—</button>
      <button class="tb-btn" data-cmd="ol" title="编号列表">1.</button>
      <button class="tb-btn" data-cmd="quote" title="引用">❝</button>
      <button class="tb-btn" data-cmd="hr" title="分隔线">—</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="table" title="插入表格">⊞</button>
      <button class="tb-btn" data-cmd="mermaid" title="Mermaid 流程图">◈</button>
      <button class="tb-btn" data-cmd="math" title="公式">∑</button>
    </div>

    <div class="spacer"></div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="zoom" data-delta="-1" title="缩小">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="tb-btn" data-cmd="zoom" data-delta="1" title="放大">＋</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="export" data-value="md" title="导出 Markdown">MD</button>
      <button class="tb-btn" data-cmd="export" data-value="html" title="导出 HTML">HTML</button>
      <button class="tb-btn" data-cmd="export" data-value="pdf" title="导出 PDF">PDF</button>
      <button class="tb-btn" data-cmd="export" data-value="docx" title="导出 Word">DOCX</button>
      <button class="tb-btn" data-cmd="export" data-value="png" title="导出 PNG 长图">PNG</button>
    </div>

    <div class="tb-sep"></div>

    <span class="save-state" id="save-state">已保存</span>
    <button class="tb-btn" data-cmd="sidebar" title="侧边栏 ⌃⌘S">☰</button>
  </div>

  <!-- Tab 栏 -->
  <div id="tab-bar" role="tablist" aria-label="文档标签"></div>

  <!-- 侧边栏 -->
  <aside id="sidebar" aria-label="侧边栏">
    <div id="side-tabs" role="tablist" aria-label="侧边栏视图">
      <button data-library="toc" class="active" role="tab" aria-selected="true">目录</button>
      <button data-library="images" role="tab" aria-selected="false">图片</button>
    </div>
    <div id="sidebar-body" role="tabpanel"></div>
  </aside>

  <!-- 主编辑区 -->
  <div id="main">
    <section class="mode-pane pane-wysiwyg pane-split">
      <div id="wysiwyg-host"></div>
    </section>

    <section class="mode-pane pane-source pane-split">
      <div id="source-host"></div>
    </section>

    <div class="pane-divider"></div>

    <section class="mode-pane pane-preview pane-split">
      <div id="preview-scroll">
        <div id="preview" class="md-body"></div>
      </div>
    </section>
  </div>

  <!-- 状态栏 -->
  <div id="statusbar">
    <span id="statusbar-stats">0 字</span>
    <span id="cursor-pos" class="cursor-pos">行 1，列 1</span>
    <span id="tab-dirty-count" class="status-dirty"></span>
    <span class="spacer"></span>
    <span class="status-hint"><kbd>⌘N</kbd>新建 <kbd>⌘O</kbd>打开 <kbd>⌘W</kbd>关标签 <kbd>⌘1-9</kbd>切换</span>
  </div>
</div>

<!-- 右侧检视器：主题 / 字体 -->
<aside class="inspector">
  <div class="insp-section">
    <div class="insp-title">导出主题</div>
    <div id="theme-cards"></div>
  </div>

  <div class="insp-section">
    <div class="insp-title">字体</div>
    <div class="insp-row">
      <label>字体族</label>
      <select id="font-select"></select>
    </div>
    <div class="insp-row">
      <label>字号</label>
      <select id="size-select"></select>
    </div>
  </div>

  <div class="insp-section">
    <div class="insp-title">选项</div>
    <label class="insp-toggle"><input type="checkbox" id="opt-toc"> 预览显示目录</label>
    <label class="insp-toggle"><input type="checkbox" id="opt-zoom"> 跟随系统字号</label>
    <div class="insp-row">
      <label>目录深度</label>
      <select id="toc-depth-select">
        <option value="1">H1</option>
        <option value="2">H1-H2</option>
        <option value="3" selected>H1-H3</option>
        <option value="4">H1-H4</option>
        <option value="5">H1-H5</option>
        <option value="6">H1-H6</option>
      </select>
    </div>
  </div>

  <div class="insp-section">
    <div class="insp-title">关于</div>
    <div style="font-size:11.5px;color:var(--fg-faint);line-height:1.8">
      MD Writer 1.0<br>
      原生 macOS Markdown 编辑器<br>
      数据全部保存在本地
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
